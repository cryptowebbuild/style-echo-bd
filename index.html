                    <span className="text-pink-300 font-bold text-lg">৳{PRODUCTS[0].price}</span>
                  </div>
                  <p className="text-xs text-stone-300">
                    {PRODUCTS[0].fabric}
                  </p>
                  <button 
                    onClick={() => openOrderModal(PRODUCTS[0])}
                    className="w-full mt-2.5 bg-gradient-to-r from-pink-500 to-roseBrand-600 hover:from-pink-600 hover:to-roseBrand-700 text-white font-bold text-xs py-3 rounded-lg shadow-lg transition-all flex items-center justify-center gap-2"
                  >
                    <i data-lucide="zap" className="w-4 h-4"></i>
                    <span>১-ক্লিকে সরাসরি ক্যাশ অন ডেলিভারি অর্ডার</span>
                  </button>
                </div>
              </div>
            </div>

          </div>
        </div>
      </section>

      {/* 4. FILTER TABS */}
      <section className="bg-white border-b border-roseBrand-100 sticky top-20 z-30 shadow-sm">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5">
          <div className="flex items-center gap-2 overflow-x-auto no-scrollbar">
            
            <button 
              onClick={() => setSelectedCategory('all')}
              className={`px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition-all ${
                selectedCategory === 'all' 
                  ? 'bg-roseBrand-700 text-white shadow' 
                  : 'bg-roseBrand-50 text-roseBrand-900 hover:bg-roseBrand-100'
              }`}
            >
              সব কালেকশন ({PRODUCTS.length})
            </button>

            <button 
              onClick={() => setSelectedCategory('three_piece')}
              className={`px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition-all ${
                selectedCategory === 'three_piece' 
                  ? 'bg-roseBrand-700 text-white shadow' 
                  : 'bg-roseBrand-50 text-roseBrand-900 hover:bg-roseBrand-100'
              }`}
            >
              কটন ও মসলিন থ্রি-পিস
            </button>

            <button 
              onClick={() => setSelectedCategory('festive')}
              className={`px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition-all ${
                selectedCategory === 'festive' 
                  ? 'bg-roseBrand-700 text-white shadow' 
                  : 'bg-roseBrand-50 text-roseBrand-900 hover:bg-roseBrand-100'
              }`}

              পার্টি ওয়্যার ও গাউন
            </button>

            <button 
              onClick={() => setSelectedCategory('kurti')}
              className={`px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition-all ${
                selectedCategory === 'kurti' 
                  ? 'bg-roseBrand-700 text-white shadow' 
                  : 'bg-roseBrand-50 text-roseBrand-900 hover:bg-roseBrand-100'
              }`}

        </div>

      {/* 5. PRODUCT CATALOG GRID */}
      <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-1">
        
        <div className="text-center max-w-2xl mx-auto mb-8 space-y-1.5">
          <span className="text-xs uppercase tracking-widest text-roseBrand-600 font-bold">
            BASHUNDHARA CITY EXCLUSIVE STORE

            রকমারি রঙে রাঙানো প্রিমিয়াম ফ্যাব্রিক

              className="bg-white rounded-xl border border-roseBrand-100 hover:border-pink-300 shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col group overflow-hidden"

                <span className="absolute top-3 left-3 bg-roseBrand-700/90 backdrop-blur-sm text-white text-[10px] font-bold px-2.5 py-1 rounded-full">
                  {product.tag}
                </span>
                <span className="absolute bottom-3 right-3 bg-white/90 backdrop-blur-sm text-stone-700 text-[10px] font-medium px-2 py-0.5 rounded">
                  {product.englishCode}

              </div>

              {/* Product Info Body */}
              <div className="p-5 flex-1 flex flex-col justify-between space-y-3">
                <div>
                  <h3 className="font-serif text-lg font-bold text-roseBrand-950 group-hover:text-roseBrand-700 transition-colors">
                    {product.name}
                  </h3>

                  <div className="mt-2 space-y-1 text-xs text-stone-600 bg-pink-50/50 p-2.5 rounded-lg border border-pink-100">
                    <p><strong>ফ্যাব্রিক:</strong> {product.fabric}</p>
                    <p><strong>কাজের বিবরণ:</strong> {product.work}</p>
                  </div>

                  <p className="mt-2.5 text-xs text-stone-500 line-clamp-2">
                    {product.description}
                  </p>
                </div>

                {/* Price & Action */}
                <div className="pt-3 border-t border-stone-100 flex items-center justify-between">
                  <div>
                    <span className="text-xs text-stone-400 line-through mr-1.5">
                      ৳{product.originalPrice.toLocaleString('en-IN')}
                    </span>
                    <span className="text-xl font-bold text-roseBrand-900">
                      ৳{product.price.toLocaleString('en-IN')}
                    </span>
                  </div>

                  <button 
                    onClick={() => openOrderModal(product)}
                    className="inline-flex items-center gap-1.5 bg-roseBrand-600 hover:bg-roseBrand-700 text-white font-bold text-xs px-3.5 py-2.5 rounded-lg shadow-sm transition-all"
                  >
                    <i data-lucide="shopping-bag" className="w-3.5 h-3.5"></i>
                    <span>১-ক্লিকে অর্ডার</span>
                  </button>
                </div>

              </div>
            </div>
          ))}
        </div>

      </main>

      {isDrawerOpen && activeProduct && (

                    src={activeProduct.image} 
                    alt={activeProduct.name}
                    className="w-16 h-16 object-cover rounded-lg border border-pink-200"
                  />

                    <h4 className="font-serif font-bold text-sm leading-snug">
                      {activeProduct.name}
                    </h4>
                    <p className="text-[11px] text-stone-500">{activeProduct.englishCode}</p>
                    <p className="text-sm font-bold text-roseBrand-700 mt-1">
                      ৳{activeProduct.price.toLocaleString('en-IN')}

                  </div>
                </div>

                {/* Size Selector */}
                <div className="space-y-1.5">
                  <label className="text-xs font-bold text-stone-700">সাইজ নির্বাচন করুন:</label>
                  <div className="grid grid-cols-2 gap-2">
                    {['Free Size / আনস্টিচড', 'স্টিচড রেডিমেড'].map(size => (
                      <button
                        key={size}
                        type="button"
                        onClick={() => setSelectedSize(size)}
                        className={`p-2.5 rounded-lg border text-xs font-semibold text-center transition-all ${
                          selectedSize === size
                            ? 'border-roseBrand-600 bg-roseBrand-50 text-roseBrand-900 ring-1 ring-roseBrand-600'
                            : 'border-stone-200 bg-white text-stone-700 hover:bg-stone-50'
                        }`}
                      >
                        {size}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Form Fields */}
                <form onSubmit={handleWhatsAppOrder} className="space-y-3.5">
                  <div>
                    <label className="block text-xs font-semibold text-stone-700 mb-1">
                      আপনার নাম <span className="text-red-500">*</span>
                    </label>
                    <input 
                      type="text"
                      required
                      placeholder="উদা: ফারজানা আক্তার"
                      value={customerName}
                      onChange={e => setCustomerName(e.target.value)}
                      className="w-full text-xs p-3 rounded-lg border border-stone-300 focus:outline-none focus:border-roseBrand-600 bg-stone-50/50"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-stone-700 mb-1">
                      মোবাইল নম্বর <span className="text-red-500">*</span>
                    </label>
                    <input 
                      type="tel"
                      required
                      placeholder="01XXXXXXXXX"
                      value={customerPhone}
                      onChange={e => setCustomerPhone(e.target.value)}
                      className="w-full text-xs p-3 rounded-lg border border-stone-300 focus:outline-none focus:border-roseBrand-600 bg-stone-50/50"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-stone-700 mb-1">
                      সম্পূর্ণ ডেলিভারি ঠিকানা <span className="text-red-500">*</span>
                    </label>
                    <textarea 
                      rows="2"
                      required
                      placeholder="বাড়ি নম্বর, রোড নম্বর, থানা, জেলা (উদা: মিরপুর-১০, ঢাকা)"
                      value={customerAddress}
                      onChange={e => setCustomerAddress(e.target.value)}
                      className="w-full text-xs p-3 rounded-lg border border-stone-300 focus:outline-none focus:border-roseBrand-600 bg-stone-50/50"
                    ></textarea>
                  </div>

                  {/* Submission Button */}
                  <button 
                    type="submit"
                    className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm py-3.5 px-4 rounded-xl shadow-md transition-all flex items-center justify-center gap-2"
                  >
                    <i data-lucide="message-circle" className="w-5 h-5"></i>
                    <span>সরাসরি WhatsApp-এ অর্ডার কনফার্ম করুন</span>
                  </button>

                  <div className="bg-emerald-50 p-3 rounded-lg border border-emerald-200 text-center">
                    <p className="text-[11px] text-emerald-800 font-semibold">
                      🔒 এক টাকাও অগ্রিম নেওয়া হয় না। প্রোডাক্ট হাতে পেয়ে মূল্য পরিশোধ করবেন।
                    </p>
                  </div>
                </form>

              </div>
            </div>
          </div>
        </div>
      )}

      {/* 7. FOOTER WITH CRYPTOWEBBUILD BACKLINK */}
      <footer className="bg-roseBrand-950 text-stone-400 text-xs border-t border-roseBrand-900 py-10">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div className="grid grid-cols-1 md:grid-cols-4 gap-8 mb-8">
            
            <div className="space-y-2">
              <div className="font-serif text-2xl font-bold text-white">
                Style <span className="text-pink-400 italic">Echo</span>
              </div>
              <p className="text-stone-400 text-xs leading-relaxed">
                বসুন্ধরা সিটি শপিং মল, লেভেল ৩, ব্লক এ, শপ ৭, ৮, ১৭, ১৮, ঢাকা। ২.৯ মিলিয়ন মানুষের ভালোবাসার নাম।
              </p>
            </div>

            <div className="space-y-1.5">
              <h4 className="text-white font-bold uppercase tracking-wider text-[11px]">শোরুম লোকেশন</h4>
              <p className="text-stone-400 text-xs">
                লেভেল ৩, ব্লক এ, দোকান ৭, ৮, ১৭, ১৮<br/>
                বসুন্ধরা সিটি শপিং কমপ্লেক্স, পান্থপথ, ঢাকা।
              </p>
            </div>

            <div className="space-y-1.5">
              <h4 className="text-white font-bold uppercase tracking-wider text-[11px]">অফিশিয়াল যোগাযোগ</h4>
              <p className="text-stone-400 text-xs">
                WhatsApp: <strong>01701-883473</strong><br/>
                ক্যাশ অন ডেলিভারি: সারা বাংলাদেশ
              </p>
            </div>

            <div className="space-y-1.5">
              <h4 className="text-white font-bold uppercase tracking-wider text-[11px]">সাইট পারফরম্যান্স</h4>
              <p className="text-stone-400 text-xs">
                ওয়ার্ডপ্রেসের স্লো প্লাগইন ছাড়া ০.৩ সেকেন্ড আল্ট্রা-লাইটওয়েট অর্ডার সিস্টেম।
              </p>
            </div>

          </div>

          <div className="pt-6 border-t border-roseBrand-900 flex flex-col sm:flex-row items-center justify-between gap-4 text-center sm:text-left">
            <p className="text-stone-500">
              © {new Date().getFullYear()} Style Echo. কনসেপ্ট ডেমো স্টোর।
            </p>
            <div className="flex items-center gap-2">
              <span className="text-stone-500">ইঞ্জিনিয়ার্ড বাই:</span>
              <a 
                href="https://cryptowebbuild.com" 
                target="_blank" 
                rel="noopener noreferrer"
                className="text-pink-400 hover:text-white font-semibold underline underline-offset-4 transition-colors"
              >
                CryptoWebBuild (Ultra-Fast DTC Systems)
              </a>
            </div>
          </div>

        </div>
      </footer>

      {/* Floating Instant WhatsApp Button */}
      <a 
        href="https://wa.me/8801701883473"
        target="_blank"
        rel="noopener noreferrer"
        className="fixed bottom-6 right-6 z-40 bg-emerald-600 hover:bg-emerald-700 text-white p-3.5 rounded-full shadow-2xl flex items-center gap-2 transition-transform hover:scale-110"
        title="WhatsApp-এ সরাসরি কথা বলুন"
      >
        <i data-lucide="message-circle" className="w-6 h-6"></i>
        <span className="max-w-0 overflow-hidden whitespace-nowrap hover:max-w-xs transition-all duration-300 text-xs font-bold pl-0 hover:pl-2">
          সরাসরি চ্যাট
        </span>
      </a>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
